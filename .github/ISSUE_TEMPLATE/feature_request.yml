name: Feature request
description: Propose an improvement to Questlog.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and any alternatives considered.
    validations:
      required: true
